name: pre-commit

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install prettier for system hook
        run: npm install -g prettier@3.8.1

      - uses: pre-commit/action@v3.0.1

      - name: Run Neovim Lua smoke test
        run: mise exec --locked -- nvim --headless --clean -u NONE -l tests/nvim/smoke.lua

      - name: Run Neovim Lua unit tests
        run: mise exec --locked -- nvim --headless --clean -u NONE -l tests/nvim/run_tests.lua
