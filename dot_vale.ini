# Vale (prose linter for markdown/text/rst). Used by nvim-lint in custom.plugins.typescript.
# StylesPath is relative to the directory that contains this file ($HOME).
# https://vale.sh/docs/topics/config/
StylesPath = .config/vale/styles
MinAlertLevel = suggestion

# https://vale.sh/docs/topics/vocab/
Vocab = Dotfiles

[*]
BasedOnStyles = Vale
