# Ranger overrides to approximate eza listing cues.
# Defaults still load unless RANGER_LOAD_DEFAULT_RC=FALSE.

# Custom preview script (bat-backed; see scope.sh).
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true

# Directories first, like eza --group-directories-first.
set sort_directories_first true

# Per-file git column, roughly eza --git.
set vcs_aware true
set vcs_backend_git enabled

# Nerd Font icons via ranger_devicons (cloned by chezmoi run_once script).
# infostring falls back to size (BrowserColumn), matching a short eza listing.
default_linemode devicons

# Exact eza long listing in the pager (icons + git + dirs first).
# Requires eza on PATH; no-op if missing only at keypress time.
map el shell -p eza -la --git --icons=auto --group-directories-first --color=always .
map et shell -p eza --tree --icons=auto --group-directories-first --color=always .
