# https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        files: \.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        files: \.md$

  # Use npm exec instead of mirrors-prettier because Workiva npm registry
  # settings in ~/.wk/config/npm.toml can break mirrored node hooks locally.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (markdown)
        entry: npm exec --yes --package prettier@3.8.1 -- prettier --write --ignore-unknown
        language: system
        types_or: [markdown]

      - id: stylua-nvim
        name: stylua (nvim lua)
        entry: mise exec --locked -- stylua --check --config-path dot_config/nvim/dot_stylua.toml dot_config/nvim tests/nvim
        language: system
        files: ^(dot_config/nvim|tests/nvim)/.*\.lua$
        pass_filenames: false
