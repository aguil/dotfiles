# https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        files: \.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        files: \.md$

  # prettier comes from .mise.toml, not mirrors-prettier (Workiva npm registry
  # settings in ~/.wk/config/npm.toml can break mirrored node hooks locally)
  # and not `npm exec --yes`, which reinstalled into ~/.npm/_npx on every run
  # and intermittently raced itself (ENOTEMPTY / truncated module) in CI.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (markdown)
        entry: mise exec --locked -- prettier --write --ignore-unknown
        language: system
        types_or: [markdown]

      - id: stylua-nvim
        name: stylua (nvim lua)
        entry: mise exec --locked -- stylua --check --config-path dot_config/nvim/dot_stylua.toml dot_config/nvim tests/nvim
        language: system
        files: ^(dot_config/nvim|tests/nvim)/.*\.lua$
        pass_filenames: false
