# Repo-local QA toolchain. Refresh lockfile after version bumps: mise lock
# Lock enforcement: qa.just uses `mise exec --locked` (see mise-security skill).
[tools]
shellcheck = "0.11.0"
shfmt = "3.12.0"
bats = "1.13.0"
just = "1.59.0"
vale = "3.14.1"
stylua = "2.5.2"
neovim = "0.12.6"
# No Windows install path: lua builds from source (needs MinGW), and the locked
# aqua pre-commit backend ships macOS/Linux only.
lua = { version = "5.5.0", os = ["linux", "macos"] }
pre-commit = { version = "4.6.0", os = ["linux", "macos"] }
node = "20.19.5"
# Drives the pre-commit prettier hook. Pinned here rather than fetched by
# `npm exec --yes` per run, which raced against its own ~/.npm/_npx install.
prettier = "3.8.1"
